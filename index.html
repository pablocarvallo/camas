<script>
    // --- LOGICA DE DATOS Y FECHAS ---

    const STORAGE_KEY = 'pool_maintenance_v1';
    let maintenanceData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

    // Configuración regional
    const monthsEs = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(maintenanceData));
        renderHistory();
    }
    
    // Función determinista para alternar nombres (Emi / Piti) usando UTC para evitar problemas de cambio de hora (DST)
    function getAlternatingName(year, monthIndex, day) {
        // Referencia fija: Miércoles 3 de Diciembre de 2025 = Emi
        const utcDate = Date.UTC(year, monthIndex, day);
        const utcRef = Date.UTC(2025, 11, 3); // Mes 11 es Diciembre

        // Diferencia exacta en días de calendario
        const diffDays = Math.round((utcDate - utcRef) / (1000 * 60 * 60 * 24));

        // Número de semanas transcurridas
        const weekNumber = Math.floor(diffDays / 7);

        // Alternancia correcta incluso para números negativos
        const normalizedWeek = ((weekNumber % 2) + 2) % 2;

        return (normalizedWeek === 0) ? 'Emi' : 'Piti';
    }

    // Obtener todos los MIÉRCOLES de un mes específico
    function getWednesdaysOfMonth(year, monthIndex) {
        const WEDNESDAY = 3; // 0=Dom, 1=Lun, 2=Mar, 3=Mié, 4=Jue, 5=Vie, 6=Sáb
        
        let d = new Date(year, monthIndex, 1);
        let wednesdays = [];
        
        // Buscar el primer miércoles
        while (d.getDay() !== WEDNESDAY) {
            d.setDate(d.getDate() + 1);
        }

        // Mientras sigamos en el mismo mes
        while (d.getMonth() === monthIndex) {
            const dayNum = d.getDate();
            const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
            const assignedName = getAlternatingName(year, monthIndex, dayNum);

            wednesdays.push({ 
                dateStr, 
                dayNum, 
                assignedName 
            });
            d.setDate(d.getDate() + 7);
        }
        return wednesdays;
    }

    // Obtener estado actual (0: null, 1: check, 2: cross)
    function getStatus(dateStr) {
        return maintenanceData[dateStr] || 0;
    }

    // Cambiar estado cíclicamente
    function toggleStatus(dateStr) {
        let current = getStatus(dateStr);
        let next = (current + 1) % 3; // 0 -> 1 -> 2 -> 0
        
        if (next === 0) {
            delete maintenanceData[dateStr];
        } else {
            maintenanceData[dateStr] = next;
        }
        saveData();
        renderWeeks();
    }

    // --- RENDERIZADO UI ---

    function renderWeeks() {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth(); // 0-11

        // Título principal
        document.getElementById('appTitle').textContent = `Miércoles de ${monthsEs[currentMonth]} ${currentYear}`;
        
        const wednesdays = getWednesdaysOfMonth(currentYear, currentMonth);
        const container = document.getElementById('weeksList');
        container.innerHTML = '';

        wednesdays.forEach(day => {
            const status = getStatus(day.dateStr);
            
            let btnClass = '';
            let iconHtml = '';
            
            if (status === 1) {
                btnClass = 'checked';
                iconHtml = '<i class="ph ph-check font-bold"></i>';
            } else if (status === 2) {
                btnClass = 'crossed';
                iconHtml = '<i class="ph ph-x font-bold"></i>';
            }

            const weekEl = document.createElement('div');
            weekEl.className = 'ios-card p-4 flex justify-between items-center';
            weekEl.innerHTML = `
                <div class="flex flex-col">
                    <span class="text-gray-900 font-semibold text-lg">Miércoles ${day.dayNum}, ${day.assignedName}</span>
                    <span class="text-gray-400 text-xs mt-0.5 font-medium">${monthsEs[currentMonth]} ${currentYear}</span>
                </div>
                <button onclick="toggleStatus('${day.dateStr}')" class="status-btn ${btnClass} shadow-sm active:scale-90">
                    ${iconHtml}
                </button>
            `;
            container.appendChild(weekEl);
        });
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        container.innerHTML = '';
        
        const groups = {};
        const keys = Object.keys(maintenanceData).sort().reverse();

        if (keys.length === 0) {
            document.getElementById('emptyHistory').classList.remove('hidden');
            document.getElementById('emptyHistory').classList.add('flex');
            return;
        } else {
            document.getElementById('emptyHistory').classList.add('hidden');
            document.getElementById('emptyHistory').classList.remove('flex');
        }

        keys.forEach(dateStr => {
            const [year, month, day] = dateStr.split('-').map(Number);
            const monthIndex = month - 1;
            const assignedName = getAlternatingName(year, monthIndex, day);

            const monthKey = `${year}-${String(month).padStart(2, '0')}`;

            if (!groups[monthKey]) {
                groups[monthKey] = {
                    year: year,
                    monthIndex: monthIndex,
                    items: []
                };
            }
            groups[monthKey].items.push({ dateStr, day, status: maintenanceData[dateStr], assignedName });
        });

        Object.values(groups).forEach(group => {
            const groupEl = document.createElement('div');
            
            let itemsHtml = '';
            group.items.sort((a, b) => b.day - a.day);

            group.items.forEach(item => {
                let statusIcon = '';
                let statusText = '';
                let statusColor = '';

                if (item.status === 1) {
                    statusIcon = '<i class="ph ph-check-circle text-green-500 text-xl"></i>';
                    statusText = 'Realizada';
                    statusColor = 'text-green-600 bg-green-50';
                } else {
                    statusIcon = '<i class="ph ph-x-circle text-red-500 text-xl"></i>';
                    statusText = 'No realizada';
                    statusColor = 'text-red-600 bg-red-50';
                }

                itemsHtml += `
                    <div class="flex items-center justify-between py-3 border-b border-gray-100 last:border-0">
                        <span class="text-gray-700 font-medium">Miércoles ${item.day}, ${item.assignedName}</span>
                        <div class="flex items-center gap-2 ${statusColor} px-2 py-1 rounded-lg text-xs font-bold uppercase tracking-wider">
                            ${statusText}
                            ${statusIcon}
                        </div>
                    </div>
                `;
            });

            groupEl.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm p-5 border border-gray-100">
                    <h4 class="text-lg font-bold text-gray-800 mb-3 border-b border-gray-100 pb-2 capitalize">
                        ${monthsEs[group.monthIndex]} ${group.year}
                    </h4>
                    <div>${itemsHtml}</div>
                </div>
            `;
            container.appendChild(groupEl);
        });
    }

    // --- NAVEGACIÓN ---

    function switchTab(tab) {
        const currentView = document.getElementById('currentView');
        const historyView = document.getElementById('historyView');
        const btnCurrent = document.getElementById('btnTabCurrent');
        const btnHistory = document.getElementById('btnTabHistory');

        if (tab === 'current') {
            currentView.classList.remove('hidden');
            historyView.classList.add('hidden');
            
            btnCurrent.classList.add('tab-active');
            btnCurrent.classList.remove('tab-inactive');
            btnHistory.classList.remove('tab-active');
            btnHistory.classList.add('tab-inactive');
            
            document.getElementById('mainContainer').scrollTop = 0;
        } else {
            renderHistory();
            currentView.classList.add('hidden');
            historyView.classList.remove('hidden');

            btnCurrent.classList.remove('tab-active');
            btnCurrent.classList.add('tab-inactive');
            btnHistory.classList.add('tab-active');
            btnHistory.classList.remove('tab-inactive');
        }
    }

    // --- COMPARTIR / CAPTURA ---

    async function shareMonth() {
        switchTab('current');

        const element = document.getElementById('captureArea');
        element.classList.add('capturing');
        
        try {
            const canvas = await html2canvas(element, {
                scale: 3,
                backgroundColor: '#ffffff',
                logging: false,
                useCORS: true
            });

            const imgData = canvas.toDataURL('image/png');
            
            document.getElementById('generatedImage').src = imgData;
            const modal = document.getElementById('shareModal');
            const content = document.getElementById('shareModalContent');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');

        } catch (err) {
            console.error("Error al capturar", err);
        } finally {
            element.classList.remove('capturing');
        }
    }

    function closeShareModal() {
        const modal = document.getElementById('shareModal');
        const content = document.getElementById('shareModalContent');
        
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    // --- INICIALIZACIÓN ---
    document.addEventListener('DOMContentLoaded', () => {
        renderWeeks();
    });
</script>
